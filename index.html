<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sputify</title>
<meta name="theme-color" content="#0E0E10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sputify">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0E0E10; --card: #1A1A1D; --ink: #FFFFFF; --muted: #A9A9B0; --line: #2C2C31;
    --accent: #D4D4D8; --accent-ink: #000000; --soft: #2A2A2E; --hover: #232327;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  svg.ic { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.ic.f { fill: currentColor; stroke: none; }

  .app { max-width: 720px; margin: 0 auto; min-height: 100%; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px); }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 28px 4px 8px; }
  h1 { margin: 0; font-size: 2.1rem; font-weight: 700; letter-spacing: -.02em; }
  .round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); }
  .round:hover { background: var(--hover); }
  .search { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 999px; padding: 0 16px; margin: 12px 0 14px; color: var(--muted); }
  .search input { flex: 1; min-width: 0; border: 0; background: none; padding: 13px 0; outline: none; color: var(--ink); }
  .search:focus-within { box-shadow: 0 0 0 3px var(--accent); }
  .tabs { display: flex; gap: 6px; background: var(--card); padding: 4px; border-radius: 999px; margin-bottom: 14px; }
  .tab { flex: 1; padding: 9px 4px; border-radius: 999px; font-weight: 600; color: var(--muted); }
  .tab[aria-selected=true] { background: var(--accent); color: var(--accent-ink); }

  .bar { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
  .bar .sp { flex: 1; color: var(--muted); font-size: .92rem; }
  .pill { padding: 8px 16px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
  .pill.alt { background: var(--card); color: var(--ink); }

  .list { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 6px; border-radius: 16px; }
  .row:hover { background: var(--hover); }
  .row.cur { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
  .row .go { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; }
  .cov { width: 52px; height: 52px; border-radius: 12px; overflow: hidden; flex: none; display: grid; place-items: center; color: rgba(255,255,255,.9); }
  .cov img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .t { min-width: 0; flex: 1; }
  .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t span { display: block; font-size: .88rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.cur .t b { color: var(--ink); }
  .dur { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .x { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .x:hover { background: var(--hover); color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 16px; }
  .alb { text-align: left; }
  .alb .cov { width: 100%; height: auto; aspect-ratio: 1; border-radius: 18px; }
  .alb b { display: block; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alb span { display: block; font-size: .88rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cov.circle { border-radius: 50%; }

  .empty { text-align: center; padding: 56px 16px; color: var(--muted); }
  .empty .big { width: 96px; height: 96px; margin: 0 auto 16px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .empty .big svg { width: 44px; height: 44px; }
  .empty h2 { margin: 0 0 6px; color: var(--ink); font-size: 1.25rem; }
  .empty .pill { margin: 6px 4px; }

  .back { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-weight: 600; }
  .dh { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; }
  .dh .cov { width: 104px; height: 104px; border-radius: 20px; }
  .dh h2 { margin: 0; font-size: 1.4rem; }
  .dh p { margin: 2px 0 10px; color: var(--muted); }

  /* mini player */
  .mini { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); max-width: 696px; margin: 0 auto;
          background: var(--card); border-radius: 22px; box-shadow: 0 6px 24px rgba(0,0,0,.18); padding: 8px 10px 10px; display: none; z-index: 5; }
  .mini.on { display: block; }
  .mini .r { display: flex; align-items: center; gap: 10px; }
  .mini .open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; }
  .mini .cov { width: 44px; height: 44px; border-radius: 10px; }
  .mini .pb { height: 3px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .mini .pb i { display: block; height: 100%; width: 0; background: var(--accent); }

  /* full player */
  .sheet { position: fixed; inset: 0; background: var(--bg); z-index: 10; transform: translateY(100%); visibility: hidden; transition: transform .28s ease, visibility 0s .28s;
           padding: calc(env(safe-area-inset-top) + 12px) 24px calc(env(safe-area-inset-bottom) + 20px); display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
  .sheet.on { transform: none; visibility: visible; transition: transform .28s ease; }
  .sheet .hd { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; }
  .sheet .art { width: min(100%, 340px); aspect-ratio: 1; border-radius: 28px; margin: 18px 0 22px; overflow: hidden; display: grid; place-items: center; color: rgba(255,255,255,.9); flex: none; }
  .sheet .art img { width: 100%; height: 100%; object-fit: cover; }
  .sheet .art svg { width: 30%; height: 30%; }
  .sheet .meta { width: 100%; max-width: 440px; }
  .sheet .meta h2 { margin: 0; font-size: 1.45rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet .meta p { margin: 2px 0 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seek { width: 100%; max-width: 440px; margin-top: 14px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; height: 22px; }
  .tm { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; }
  .ctl .ib { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
  .ctl .ib[aria-pressed=true] { color: var(--accent-ink); background: var(--accent); }
  .ctl .main { width: 72px; height: 72px; background: var(--accent); color: var(--accent-ink); }
  .ctl .main svg { width: 32px; height: 32px; }
  .foot { display: flex; gap: 10px; margin-top: 6px; }
  .qp { position: absolute; inset: 0; background: var(--bg); padding: calc(env(safe-area-inset-top) + 12px) 16px 20px; overflow-y: auto; display: none; }
  .qp.on { display: block; }
  .qp .wrap { max-width: 520px; margin: 0 auto; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 110px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; z-index: 30; display: none; max-width: 90%; }
  .toast.on { display: block; }
  dialog { border: 0; border-radius: 24px; background: var(--card); color: var(--ink); padding: 22px; width: calc(100% - 32px); max-width: 380px; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog h3 { margin: 0 0 12px; }
  dialog .opt { display: block; width: 100%; text-align: left; padding: 14px 12px; border-radius: 14px; font-weight: 600; }
  dialog .opt:hover { background: var(--hover); }
  dialog .opt[aria-pressed=true] { background: var(--soft); color: var(--accent); }
  dialog input[type=text] { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); margin-bottom: 14px; }
  .dact { display: flex; gap: 8px; justify-content: flex-end; }
  @media (prefers-reduced-motion: reduce) { .sheet, .sheet.on { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <h1>Sputify</h1>
    <button class="round" id="addbtn" aria-label="Aggiungi musica"><svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  </div>
  <label class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
    <input id="q" type="search" placeholder="Cerca brani, album, artisti" aria-label="Cerca"></label>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="tracks" aria-selected="true">Brani</button>
    <button class="tab" role="tab" data-tab="albums" aria-selected="false">Album</button>
    <button class="tab" role="tab" data-tab="artists" aria-selected="false">Artisti</button>
    <button class="tab" role="tab" data-tab="playlists" aria-selected="false">Playlist</button>
  </div>
  <div id="view"></div>
</div>

<div class="mini" id="mini">
  <div class="r">
    <button class="open" id="miniopen" aria-label="Apri il lettore"><span class="cov" id="minicov"></span><span class="t"><b id="minit"></b><span id="minia"></span></span></button>
    <button class="x" id="miniprev" aria-label="Precedente"><svg class="ic f" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
    <button class="x" id="miniplay" aria-label="Riproduci"><svg class="ic f" viewBox="0 0 24 24" id="miniplayic"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="x" id="mininext" aria-label="Successivo"><svg class="ic f" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg></button>
  </div>
  <div class="pb"><i id="minipb"></i></div>
</div>

<section class="sheet" id="sheet" aria-label="Lettore">
  <div class="hd">
    <button class="round" id="close" aria-label="Chiudi"><svg class="ic" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
    <span style="color:var(--muted);font-weight:600">In riproduzione</span>
    <button class="round" id="qopen" aria-label="Coda"><svg class="ic" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></button>
  </div>
  <div class="art" id="bigart"></div>
  <div class="meta"><h2 id="bt"></h2><p id="ba"></p></div>
  <div class="seek">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posizione">
    <div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  </div>
  <div class="ctl">
    <button class="ib" id="shuf" aria-pressed="false" aria-label="Casuale"><svg class="ic" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
    <button class="ib" id="prev" aria-label="Precedente"><svg class="ic f" viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
    <button class="ib main" id="play" aria-label="Riproduci"><svg class="ic f" viewBox="0 0 24 24" id="playic"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ib" id="next" aria-label="Successivo"><svg class="ic f" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg></button>
    <button class="ib" id="rep" aria-pressed="false" aria-label="Ripeti"><svg class="ic" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
  </div>
  <div class="foot">
    <button class="pill alt" id="sleep"><svg class="ic" viewBox="0 0 24 24" style="width:20px;height:20px"><circle cx="12" cy="13" r="8"/><polyline points="12 9 12 13 15 15"/></svg><span id="sleeplbl">Timer</span></button>
    <button class="pill alt" id="plbtn"><svg class="ic" viewBox="0 0 24 24" style="width:20px;height:20px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Playlist</button>
  </div>
  <div class="qp" id="qp"><div class="wrap">
    <div class="bar"><button class="back" id="qclose"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Coda</button></div>
    <ul class="list" id="qlist"></ul>
  </div></div>
</section>

<dialog id="adddlg">
  <h3>Aggiungi musica</h3>
  <button class="opt" id="pickfiles">Scegli file audio</button>
  <button class="opt" id="pickdir">Scegli una cartella</button>
  <button class="opt" id="adddone" style="color:var(--muted)">Annulla</button>
</dialog>
<dialog id="sleepdlg">
  <h3>Timer di spegnimento</h3>
  <div id="sleepopts"></div>
</dialog>
<dialog id="pickdlg"><h3>Aggiungi a playlist</h3><div id="pickopts"></div><button class="opt" id="pickcancel" style="color:var(--muted)">Annulla</button></dialog>
<dialog id="namedlg"><form method="dialog" id="nameform"><h3 id="nametitle">Nuova playlist</h3>
  <input id="nameinput" type="text" maxlength="60" placeholder="Nome della playlist" aria-label="Nome della playlist" autocomplete="off">
  <div class="dact"><button type="button" class="pill alt" id="namecancel">Annulla</button><button class="pill" type="submit">Salva</button></div></form></dialog>
<input type="file" id="files" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav,.aac" multiple hidden>
<input type="file" id="dir" webkitdirectory multiple hidden>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = s => { if (!isFinite(s)) return '0:00'; s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const NOTE = '<svg class="ic" viewBox="0 0 24 24" style="width:46%;height:46%"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
  const GRAY = 'background:linear-gradient(135deg,#4A4A52,#26262B)';
  const AUDIO_RE = /\.(mp3|m4a|flac|ogg|opus|wav|aac|wma|aiff?)$/i;

  /* ---------- Storage (IndexedDB) ---------- */
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open('sputify', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tracks', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const tx = (mode, fn) => dbp.then(db => new Promise((res, rej) => {
    const t = db.transaction('tracks', mode);
    const r = fn(t.objectStore('tracks'));
    t.oncomplete = () => res(r && r.result);
    t.onerror = () => rej(t.error);
  }));

  /* ---------- State ---------- */
  const S = { lib: [], tab: 'tracks', detail: null, q: '', queue: [], qi: -1, shuffle: false, repeat: 0, history: [], sleepEnd: 0, sleepT: null };
  S.pls = (() => { try { return JSON.parse(localStorage.getItem('sputify.pls') || '[]'); } catch { return []; } })();
  S.pendingAdd = null; S.nameMode = 'new';
  const savePls = () => { try { localStorage.setItem('sputify.pls', JSON.stringify(S.pls)); } catch { toast('Impossibile salvare le playlist'); } };
  const byId = id => S.lib.find(t => t.id === id);
  const curPl = () => S.detail && S.detail.type === 'playlist' ? S.pls.find(p => p.id === S.detail.key) : null;
  const cur = () => byId(S.queue[S.qi]);
  const audio = new Audio();
  let audioUrl = '';
  const artUrls = new Map();
  const artUrl = t => { if (!t.art) return ''; if (!artUrls.has(t.id)) artUrls.set(t.id, URL.createObjectURL(t.art)); return artUrls.get(t.id); };
  const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const cover = (t, cls = '') => {
    const u = t && artUrl(t);
    const key = t ? (t.album || t.title) : '';
    return `<span class="cov ${cls}" style="${u ? '' : GRAY}">${u ? `<img src="${u}" alt="">` : NOTE}</span>`;
  };
  const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); };

  /* ---------- Import ---------- */
  const readMeta = file => new Promise(res => {
    const done = o => res(o || {});
    if (!window.jsmediatags) return done();
    const to = setTimeout(done, 4000);
    try {
      window.jsmediatags.read(file, {
        onSuccess: r => { clearTimeout(to); const g = r.tags || {};
          let art = null;
          if (g.picture) try { art = new Blob([new Uint8Array(g.picture.data)], { type: g.picture.format || 'image/jpeg' }); } catch {}
          done({ title: g.title, artist: g.artist, album: g.album, art }); },
        onError: () => { clearTimeout(to); done(); }
      });
    } catch { clearTimeout(to); done(); }
  });
  const getDur = file => new Promise(res => {
    const a = new Audio(), u = URL.createObjectURL(file);
    const end = d => { URL.revokeObjectURL(u); res(d || 0); };
    a.preload = 'metadata';
    a.onloadedmetadata = () => end(a.duration);
    a.onerror = () => end(0);
    setTimeout(() => end(0), 6000);
    a.src = u;
  });
  async function importFiles(list) {
    const files = [...list].filter(f => f.type.startsWith('audio/') || AUDIO_RE.test(f.name));
    if (!files.length) { toast('Nessun file audio trovato'); return; }
    let added = 0;
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      toast(`Importazione ${i + 1} di ${files.length}…`);
      if (S.lib.some(t => t.fname === f.name && t.size === f.size)) continue;
      const m = await readMeta(f);
      const base = f.name.replace(/\.[^.]+$/, '');
      let title = m.title, artist = m.artist;
      if (!title) { const p = base.split(' - '); if (p.length > 1) { artist = artist || p[0].trim(); title = p.slice(1).join(' - ').trim(); } else title = base; }
      const rec = { title, artist: artist || '', album: m.album || '', art: m.art || null, duration: await getDur(f), file: f, fname: f.name, size: f.size, added: Date.now() };
      try { rec.id = await tx('readwrite', s => s.add(rec)); S.lib.push(rec); added++; }
      catch { toast('Spazio esaurito: impossibile salvare altri brani'); break; }
    }
    toast(added ? `${added} brani aggiunti` : 'Brani già presenti');
    render();
  }

  /* ---------- Views ---------- */
  const cmp = (a, b) => String(a).localeCompare(String(b), 'it', { sensitivity: 'base' });
  const match = t => !S.q || [t.title, t.artist, t.album].some(x => x && x.toLowerCase().includes(S.q.toLowerCase()));
  const tracksSorted = () => S.lib.filter(match).sort((a, b) => cmp(a.title, b.title));
  const groups = key => {
    const m = new Map();
    S.lib.filter(match).forEach(t => { const k = t[key] || (key === 'album' ? 'Album sconosciuto' : 'Artista sconosciuto'); if (!m.has(k)) m.set(k, []); m.get(k).push(t); });
    return [...m.entries()].sort((a, b) => cmp(a[0], b[0]));
  };
  const empty = () => `<div class="empty"><div class="big">${NOTE}</div><h2>Nessun brano</h2><p>Aggiungi la musica che hai sul dispositivo. Resta salvata nell'app anche senza rete.</p><button class="pill" data-act="add">Aggiungi musica</button></div>`;

  function rowHtml(t, ctx, i, inPl) {
    const c = cur();
    const act = inPl
      ? `<button class="x" data-rmpl="${t.id}" aria-label="Rimuovi dalla playlist"><svg class="ic" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>`
      : `<button class="x" data-del="${t.id}" aria-label="Rimuovi ${esc(t.title)} dall'app"><svg class="ic" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>`;
    return `<li class="row ${c && c.id === t.id ? 'cur' : ''}"><button class="go" data-play="${ctx}" data-i="${i}" aria-label="Riproduci ${esc(t.title)}">${cover(t)}<span class="t"><b>${esc(t.title)}</b><span>${esc(t.artist || 'Artista sconosciuto')}${t.album ? ' · ' + esc(t.album) : ''}</span></span><span class="dur">${fmt(t.duration)}</span></button><button class="x" data-addpl="${t.id}" aria-label="Aggiungi a una playlist"><svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>${act}</li>`;
  }
  let ctxLists = {};
  function listBlock(tracks, ctx, inPl) {
    ctxLists[ctx] = tracks.map(t => t.id);
    return `<div class="bar"><span class="sp">${tracks.length} brani</span><button class="pill" data-shuf="${ctx}">Casuale</button><button class="pill alt" data-all="${ctx}">Riproduci</button></div><ul class="list">${tracks.map((t, i) => rowHtml(t, ctx, i, inPl)).join('')}</ul>`;
  }

  const plCover = p => cover(byId(p.ids.find(id => byId(id))));
  function render() {
    ctxLists = {};
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab && !S.detail)));
    const v = $('#view');
    if (!S.lib.length) { v.innerHTML = empty(); syncPlayer(); return; }
    const BACK = '<button class="back" data-act="back"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Indietro</button>';
    if (S.detail && S.detail.type === 'playlist') {
      const p = curPl();
      if (!p) { S.detail = null; return render(); }
      const tr = p.ids.map(byId).filter(Boolean);
      v.innerHTML = BACK + `<div class="dh">${plCover(p)}<div><h2>${esc(p.name)}</h2><p>${tr.length} brani</p><div class="bar" style="margin:0"><button class="pill alt" data-act="renpl">Rinomina</button><button class="pill alt" data-act="delpl">Elimina</button></div></div></div>`
        + (tr.length ? listBlock(tr, 'd', true) : '<div class="empty"><p>Playlist vuota. Aggiungi brani con il tasto + accanto a ogni brano.</p></div>');
    } else if (S.detail) {
      const { type, key } = S.detail;
      const tr = S.lib.filter(t => (t[type] || (type === 'album' ? 'Album sconosciuto' : 'Artista sconosciuto')) === key).sort((a, b) => cmp(a.title, b.title));
      v.innerHTML = BACK + `<div class="dh">${cover(tr[0], type === 'artist' ? 'circle' : '')}<div><h2>${esc(key)}</h2><p>${tr.length} brani</p></div></div>` + listBlock(tr, 'd');
    } else if (S.tab === 'playlists') {
      const rows = S.pls.map(p => `<li class="row"><button class="go" data-open="playlist" data-key="${p.id}">${plCover(p)}<span class="t"><b>${esc(p.name)}</b><span>${p.ids.filter(byId).length} brani</span></span></button></li>`).join('');
      v.innerHTML = `<div class="bar"><span class="sp">${S.pls.length} playlist</span><button class="pill" data-act="newpl">Nuova playlist</button></div>`
        + (rows ? `<ul class="list">${rows}</ul>` : '<div class="empty"><p>Nessuna playlist. Creane una e aggiungi i tuoi brani preferiti.</p></div>');
    } else if (S.tab === 'tracks') {
      const tr = tracksSorted();
      v.innerHTML = tr.length ? listBlock(tr, 't') : '<div class="empty"><p>Nessun risultato</p></div>';
    } else {
      const type = S.tab === 'albums' ? 'album' : 'artist';
      const g = groups(type);
      if (!g.length) v.innerHTML = '<div class="empty"><p>Nessun risultato</p></div>';
      else if (type === 'album')
        v.innerHTML = `<div class="grid">${g.map(([k, a]) => `<button class="alb" data-open="album" data-key="${esc(k)}">${cover(a[0])}<b>${esc(k)}</b><span>${esc(a[0].artist || 'Artista sconosciuto')}</span></button>`).join('')}</div>`;
      else
        v.innerHTML = `<ul class="list">${g.map(([k, a]) => `<li class="row"><button class="go" data-open="artist" data-key="${esc(k)}">${cover(a[0], 'circle')}<span class="t"><b>${esc(k)}</b><span>${a.length} brani</span></span></button></li>`).join('')}</ul>`;
    }
    syncPlayer();
  }

  /* ---------- Playback ---------- */
  function playQueue(ids, i) { S.queue = ids.slice(); S.qi = i; S.history = []; start(); }
  function start() {
    const t = cur(); if (!t) return;
    if (audioUrl) URL.revokeObjectURL(audioUrl);
    audioUrl = URL.createObjectURL(t.file);
    audio.src = audioUrl;
    audio.play().catch(() => {});
    media(t); syncPlayer(); markRows();
  }
  function next(auto) {
    if (!S.queue.length) return;
    if (auto && S.repeat === 2) { audio.currentTime = 0; audio.play(); return; }
    if (S.shuffle && S.queue.length > 1) {
      S.history.push(S.qi);
      let n; do { n = Math.floor(Math.random() * S.queue.length); } while (n === S.qi);
      S.qi = n;
    } else if (S.qi < S.queue.length - 1) { S.history.push(S.qi); S.qi++; }
    else if (S.repeat === 1 || !auto) { S.history.push(S.qi); S.qi = 0; }
    else { audio.pause(); audio.currentTime = 0; syncPlayer(); return; }
    start();
  }
  function prev() {
    if (!S.queue.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    if (S.history.length) S.qi = S.history.pop(); else if (S.qi > 0) S.qi--;
    start();
  }
  const toggle = () => { if (!cur()) return; audio.paused ? audio.play().catch(() => {}) : audio.pause(); };
  function media(t) {
    if (!('mediaSession' in navigator)) return;
    try {
      const u = artUrl(t);
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album, artwork: u ? [{ src: u, sizes: '512x512', type: t.art.type || 'image/jpeg' }] : [] });
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('previoustrack', prev);
      navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
      navigator.mediaSession.setActionHandler('seekto', e => { audio.currentTime = e.seekTime; });
    } catch {}
  }
  const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  function syncPlayer() {
    const t = cur();
    $('#mini').classList.toggle('on', !!t);
    if (!t) return;
    $('#minicov').outerHTML = cover(t).replace('class="cov ', 'id="minicov" class="cov ');
    $('#minit').textContent = t.title; $('#minia').textContent = t.artist || 'Artista sconosciuto';
    $('#bt').textContent = t.title; $('#ba').textContent = (t.artist || 'Artista sconosciuto') + (t.album ? ' · ' + t.album : '');
    const u = artUrl(t);
    const art = $('#bigart');
    art.style.background = u ? '' : 'linear-gradient(135deg,#4A4A52,#26262B)';
    art.innerHTML = u ? `<img src="${u}" alt="">` : NOTE;
    const p = audio.paused;
    $('#miniplayic').innerHTML = $('#playic').innerHTML = p ? PLAY : PAUSE;
    $('#miniplay').setAttribute('aria-label', p ? 'Riproduci' : 'Pausa');
    $('#play').setAttribute('aria-label', p ? 'Riproduci' : 'Pausa');
    document.title = t.title + ' – ' + (t.artist || 'Sputify');
    renderQueue();
  }
  function markRows() {
    const t = cur();
    document.querySelectorAll('.row').forEach(r => { const b = r.querySelector('[data-play]'); if (!b) return; const id = ctxLists[b.dataset.play][+b.dataset.i]; r.classList.toggle('cur', !!t && t.id === id); });
  }
  function renderQueue() {
    $('#qlist').innerHTML = S.queue.map((id, i) => { const t = byId(id); if (!t) return ''; return `<li class="row ${i === S.qi ? 'cur' : ''}"><button class="go" data-q="${i}">${cover(t)}<span class="t"><b>${esc(t.title)}</b><span>${esc(t.artist || 'Artista sconosciuto')}</span></span></button></li>`; }).join('');
  }

  audio.addEventListener('play', syncPlayer);
  audio.addEventListener('pause', syncPlayer);
  audio.addEventListener('loadedmetadata', () => { $('#dur').textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', () => {
    const r = audio.duration ? audio.currentTime / audio.duration : 0;
    $('#cur').textContent = fmt(audio.currentTime);
    $('#seek').value = Math.round(r * 1000);
    $('#minipb').style.width = (r * 100) + '%';
  });
  audio.addEventListener('ended', () => next(true));
  audio.addEventListener('error', () => { if (audio.src) { toast('Impossibile riprodurre questo file'); setTimeout(() => next(true), 800); } });

  /* ---------- Sleep timer ---------- */
  function setSleep(min) {
    clearTimeout(S.sleepT);
    if (!min) { S.sleepEnd = 0; $('#sleeplbl').textContent = 'Timer'; return; }
    S.sleepEnd = Date.now() + min * 60000;
    S.sleepT = setTimeout(() => { audio.pause(); S.sleepEnd = 0; $('#sleeplbl').textContent = 'Timer'; toast('Timer scaduto: musica in pausa'); }, min * 60000);
    $('#sleeplbl').textContent = min + ' min';
  }
  $('#sleepopts').innerHTML = [[0, 'Disattivato'], [15, '15 minuti'], [30, '30 minuti'], [45, '45 minuti'], [60, '1 ora']].map(([m, l]) => `<button class="opt" data-sleep="${m}">${l}</button>`).join('');

  /* ---------- Events ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('button'); if (!el) return;
    const d = el.dataset;
    if (d.tab) { S.tab = d.tab; S.detail = null; render(); }
    else if (d.act === 'add') $('#adddlg').showModal();
    else if (d.act === 'newpl') { S.nameMode = 'new'; S.pendingAdd = null; openName(''); }
    else if (d.act === 'newpl-add') { $('#pickdlg').close(); S.nameMode = 'new'; openName(''); }
    else if (d.act === 'renpl') { const p = curPl(); if (p) { S.nameMode = 'ren'; openName(p.name); } }
    else if (d.act === 'delpl') { const p = curPl(); if (p && confirm(`Eliminare la playlist "${p.name}"? I brani restano nella libreria.`)) { S.pls = S.pls.filter(x => x !== p); savePls(); S.detail = null; render(); } }
    else if (d.addpl) { S.pendingAdd = +d.addpl; openPick(); }
    else if (d.pick) { addToPl(+d.pick); }
    else if (d.rmpl) { const p = curPl(); if (p) { p.ids = p.ids.filter(x => x !== +d.rmpl); savePls(); render(); } }
    else if (d.act === 'back') { S.detail = null; render(); }
    else if (d.open) { S.detail = { type: d.open, key: d.open === 'playlist' ? +d.key : d.key }; render(); scrollTo(0, 0); }
    else if (d.play) { const ids = ctxLists[d.play]; playQueue(ids, +d.i); }
    else if (d.all) { const ids = ctxLists[d.all]; if (ids.length) { S.shuffle = false; $('#shuf').setAttribute('aria-pressed', 'false'); playQueue(ids, 0); } }
    else if (d.shuf) { const ids = ctxLists[d.shuf]; if (ids.length) { S.shuffle = true; $('#shuf').setAttribute('aria-pressed', 'true'); playQueue(ids, Math.floor(Math.random() * ids.length)); } }
    else if (d.del) {
      const t = byId(+d.del);
      if (t && confirm(`Rimuovere "${t.title}" dall'app?`)) {
        tx('readwrite', s => s.delete(t.id)).then(() => {
          const wasCur = cur() && cur().id === t.id;
          S.lib = S.lib.filter(x => x.id !== t.id);
          S.pls.forEach(p => { p.ids = p.ids.filter(x => x !== t.id); }); savePls();
          const i = S.queue.indexOf(t.id);
          if (i >= 0) { S.queue.splice(i, 1); if (i < S.qi) S.qi--; else if (wasCur) { S.qi--; if (S.queue.length) next(false); else { audio.pause(); audio.removeAttribute('src'); S.qi = -1; } } }
          if (artUrls.has(t.id)) { URL.revokeObjectURL(artUrls.get(t.id)); artUrls.delete(t.id); }
          render();
        });
      }
    }
    else if (d.q) { S.qi = +d.q; S.history = []; start(); }
    else if (d.sleep !== undefined) { setSleep(+d.sleep); $('#sleepdlg').close(); }
  });
  $('#addbtn').onclick = () => $('#adddlg').showModal();
  $('#adddone').onclick = () => $('#adddlg').close();
  $('#pickfiles').onclick = () => { $('#adddlg').close(); $('#files').click(); };
  $('#pickdir').onclick = () => { $('#adddlg').close(); $('#dir').click(); };
  $('#files').onchange = e => { importFiles(e.target.files); e.target.value = ''; };
  $('#dir').onchange = e => { importFiles(e.target.files); e.target.value = ''; };
  $('#q').oninput = e => { S.q = e.target.value.trim(); render(); };
  $('#miniopen').onclick = () => $('#sheet').classList.add('on');
  $('#close').onclick = () => $('#sheet').classList.remove('on');
  $('#qopen').onclick = () => $('#qp').classList.add('on');
  $('#qclose').onclick = () => $('#qp').classList.remove('on');
  $('#miniplay').onclick = toggle; $('#play').onclick = toggle;
  $('#mininext').onclick = () => next(false); $('#next').onclick = () => next(false); $('#prev').onclick = prev;
  $('#shuf').onclick = e => { S.shuffle = !S.shuffle; e.currentTarget.setAttribute('aria-pressed', String(S.shuffle)); };
  $('#rep').onclick = e => { S.repeat = (S.repeat + 1) % 3; e.currentTarget.setAttribute('aria-pressed', String(S.repeat > 0)); e.currentTarget.setAttribute('aria-label', ['Ripeti: no', 'Ripeti tutti', 'Ripeti brano'][S.repeat]); toast(['Ripeti: no', 'Ripeti tutti', 'Ripeti brano'][S.repeat]); };
  $('#sleep').onclick = () => $('#sleepdlg').showModal();
  $('#seek').oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };
  document.addEventListener('keydown', e => { if (e.code === 'Space' && !e.target.closest('input,button,dialog')) { e.preventDefault(); toggle(); } });

  /* ---------- Playlist dialogs ---------- */
  function openName(v) {
    $('#nameinput').value = v;
    $('#nametitle').textContent = S.nameMode === 'ren' ? 'Rinomina playlist' : 'Nuova playlist';
    $('#namedlg').showModal();
    setTimeout(() => $('#nameinput').focus(), 0);
  }
  function openPick() {
    $('#pickopts').innerHTML = S.pls.map(p => `<button class="opt" data-pick="${p.id}">${esc(p.name)} <span style="color:var(--muted)">· ${p.ids.length}</span></button>`).join('')
      + '<button class="opt" data-act="newpl-add">+ Nuova playlist</button>';
    $('#pickdlg').showModal();
  }
  function addToPl(id) {
    const p = S.pls.find(x => x.id === id);
    if (!p || S.pendingAdd == null) return;
    if (p.ids.includes(S.pendingAdd)) toast(`Già presente in "${p.name}"`);
    else { p.ids.push(S.pendingAdd); savePls(); toast(`Aggiunto a "${p.name}"`); }
    $('#pickdlg').close(); render();
  }
  $('#nameform').addEventListener('submit', () => {
    const name = $('#nameinput').value.trim();
    if (!name) return;
    if (S.nameMode === 'ren') { const p = curPl(); if (p) p.name = name; }
    else { S.pls.push({ id: Date.now(), name, ids: S.pendingAdd != null ? [S.pendingAdd] : [] }); if (S.pendingAdd != null) toast(`Aggiunto a "${name}"`); }
    S.pendingAdd = null; savePls(); render();
  });
  $('#pickcancel').onclick = () => $('#pickdlg').close();
  $('#namecancel').onclick = () => $('#namedlg').close();
  $('#plbtn').onclick = () => { const t = cur(); if (t) { S.pendingAdd = t.id; openPick(); } };
  $('#miniprev').onclick = prev;

  /* ---------- Start ---------- */
  tx('readonly', s => s.getAll()).then(all => { S.lib = all || []; render(); }).catch(() => { render(); toast('Archivio non disponibile in questo browser'); });
  if ('storage' in navigator && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
